# 문서를 다시 크롤링해 바뀐 페이지만 재임베딩하고 변경 내역을 doc_changes에 기록한다 (ADR-002)
# 임베딩 일일 한도로 중단돼도 반영된 페이지는 커밋되어 있으므로 다음 실행이 남은 페이지부터 이어서 처리한다
# 수집한 문서 예시 코드의 에러 목록(source-errors.json, ADR-009)을 다시 만들어 바뀌었으면 main에 커밋한다 (Vercel이 다시 배포)
# 이어서 요약이 없는 이력을 요약한다 (요약도 상한을 넘은 이력은 다음 실행에서 이어서 처리)
name: Sync docs

on:
  schedule:
    - cron: "0 18 * * 0" # 매주 월요일 03:00 KST
  workflow_dispatch:

concurrency:
  group: sync-docs

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      errors-ready: ${{ steps.errors.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # secret을 다루는 job이라 서드파티 action 대신 npm으로 pnpm을 설치한다
      - run: npm install -g pnpm@12.6.0
      # 요약 스크립트가 apps/web의 llm.ts(LangChain)를 쓰므로 web 의존성도 설치한다
      - run: pnpm install --frozen-lockfile --filter scripts --filter web
      - run: pnpm --filter scripts crawl
      - run: pnpm --filter scripts chunk
      # embed 스크립트의 --env-file(로컬 .env.local) 대신 secret을 환경 변수로 넘긴다
      - run: pnpm --filter scripts exec tsx embed.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMBED_DATABASE_URL: ${{ secrets.EMBED_DATABASE_URL }}
      - run: node scripts/bundle-types.mjs
        working-directory: apps/web
      - run: pnpm --filter scripts verify-docs --write
      - uses: actions/upload-artifact@v4
        with:
          name: source-errors
          path: apps/web/src/lib/source-errors.json
      - id: errors
        run: echo "ready=true" >> "$GITHUB_OUTPUT"
      # 챗봇 기본 모델(GEMINI_MODEL)의 한도를 쓰지 않도록 lite 모델로 요약한다
      - run: pnpm --filter scripts exec tsx summarize-changes.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          EMBED_DATABASE_URL: ${{ secrets.EMBED_DATABASE_URL }}

  # 쓰기 권한은 저장소·의존성 코드를 실행하지 않는 별도 job에만 준다 (sync job의 코드가 git 훅·설정으로 토큰을 가로채지 못하게)
  # 요약 단계가 실패해도 에러 목록은 반영한다
  commit-source-errors:
    needs: sync
    if: ${{ !cancelled() && needs.sync.outputs.errors-ready == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source-errors
          path: ${{ runner.temp }}/artifact
      # 페이지 URL → "에러코드:식별자" 문자열 배열 형태인지 확인한 뒤 반영한다
      - run: |
          f="$RUNNER_TEMP/artifact/source-errors.json"
          jq -e 'type == "object" and all(.[]; type == "array" and all(.[]; type == "string" and test("^[0-9]+:[A-Za-z0-9_$.]+$")))' "$f" > /dev/null
          cp "$f" apps/web/src/lib/source-errors.json
      # 실행 중에 main이 앞서 나갔을 수 있으므로 rebase 후 push한다
      - run: |
          git add apps/web/src/lib/source-errors.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 문서 동기화로 출처 코드 에러 목록 갱신"
          git pull --rebase origin main
          git push origin HEAD:main
